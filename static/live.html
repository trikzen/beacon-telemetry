<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beacon-telemetry live feed</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.25rem; margin: 0; }
    #status {
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      background: #b42318;
    }
    #status.live { background: #157f3b; }
    .meta { margin: 12px 0 0; font-size: 0.9rem; opacity: 0.75; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.9rem; }
    th, td {
      text-align: left;
      padding: 7px 8px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.3);
    }
    td.data { font-family: ui-monospace, Consolas, monospace; font-size: 0.82rem; word-break: break-all; }
    #empty { margin-top: 24px; opacity: 0.7; }
  </style>
</head>
<body>
  <header>
    <h1>beacon-telemetry: live feed</h1>
    <span id="status">Disconnected</span>
  </header>
  <p class="meta">Events received this session: <strong id="count">0</strong> (showing the latest 50)</p>

  <table>
    <thead>
      <tr><th>Time</th><th>Device</th><th>Seq</th><th>Type</th><th>Data</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="empty">Waiting for events. Run <code>python fake_device.py</code> in another window.</p>

  <script>
    const MAX_ROWS = 50;
    const statusEl = document.getElementById("status");
    const rowsEl = document.getElementById("rows");
    const countEl = document.getElementById("count");
    const emptyEl = document.getElementById("empty");
    let total = 0;

    function setStatus(live) {
      statusEl.textContent = live ? "Live" : "Disconnected: retrying...";
      statusEl.classList.toggle("live", live);
    }

    function addRow(e) {
      const tr = document.createElement("tr");
      const cells = [
        new Date(e.timestamp).toLocaleTimeString(),
        e.device_id,
        e.sequence,
        e.event_type,
        JSON.stringify(e.data),
      ];
      cells.forEach((value, i) => {
        const td = document.createElement("td");
        td.textContent = value;      // textContent, never innerHTML: device data is untrusted
        if (i === 4) td.className = "data";
        tr.appendChild(td);
      });
      rowsEl.prepend(tr);
      while (rowsEl.children.length > MAX_ROWS) rowsEl.lastChild.remove();
      total += 1;
      countEl.textContent = total;
      emptyEl.hidden = true;
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${protocol}://${location.host}/ws`);

      ws.onopen = () => setStatus(true);
      ws.onclose = () => {
        setStatus(false);
        setTimeout(connect, 2000);   // try again in 2 seconds
      };
      ws.onmessage = (message) => {
        try {
          const payload = JSON.parse(message.data);
          if (payload.type === "event") addRow(payload.event);
        } catch (err) {
          console.error("Bad message from server", err);
        }
      };
    }

    connect();
  </script>
</body>
</html>
