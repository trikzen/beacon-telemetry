<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beacon-telemetry dashboard</title>
  <script>
    // Apply the saved (or system) theme before the first paint, so there is no flash.
    (function () {
      var theme = "light";
      try {
        theme = localStorage.getItem("theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (err) { /* storage blocked: fall back to light */ }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <header class="topbar">
    <h1>beacon-telemetry</h1>
    <div class="topbar-right">
      <span id="status" class="badge">Disconnected</span>
      <a class="btn btn-icon" href="https://github.com/trikzen/beacon-telemetry" target="_blank"
        rel="noopener noreferrer" aria-label="View source on GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"></path></svg>
        <span>GitHub</span>
      </a>
      <button id="clearBtn" class="btn" type="button"
        title="Clear the feed and charts on this page. Stored data is not deleted.">Clear</button>
      <button id="themeToggle" class="btn" type="button" aria-pressed="false">Dark mode</button>
    </div>
  </header>

  <p id="demoBanner" class="demo-banner" hidden>
    <strong>Demo mode.</strong> Devices named <code>demo_*</code> are simulated by the server, not real hardware.
  </p>

  <main class="layout">
    <aside class="sidebar">
      <h2>Devices</h2>
      <label class="field">
        Show
        <select id="deviceFilter">
          <option value="all">All devices</option>
        </select>
      </label>
      <ul id="deviceList" class="device-list"></ul>
      <p id="noDevices" class="muted">No devices yet.</p>
    </aside>

    <section class="content">
      <h2>Charts</h2>
      <p id="chartsNotice" class="notice" hidden></p>
      <p id="chartsEmpty" class="muted">Charts appear once events arrive.</p>
      <div id="charts" class="charts"></div>

      <h2>Live feed</h2>
      <p id="feedMeta" class="muted"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Device</th>
              <th>Seq</th>
              <th>Type</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="emptyFeed" class="muted">Waiting for events</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
  <script src="/static/app.js"></script>
</body>

</html>
